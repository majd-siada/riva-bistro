name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: riva_bistro
          POSTGRES_USER: riva
          POSTGRES_PASSWORD: riva_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riva -d riva_bistro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: riva_bistro
      POSTGRES_USER: riva
      POSTGRES_PASSWORD: riva_dev_password
      DATABASE_URL: postgres://riva:riva_dev_password@localhost:5432/riva_bistro
      DJANGO_SECRET_KEY: ci-secret-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Migrations
        run: python manage.py migrate --noinput
      - name: Pytest
        run: pytest

  frontend:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://rivabistro.se
          NEXT_PUBLIC_API_URL: https://api.rivabistro.se
      - name: Typecheck generated API client
        working-directory: frontend/packages/api-client
        run: |
          npm ci
          npm run typecheck
