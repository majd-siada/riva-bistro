services:
  postgres:
    image: postgres:17-alpine
    container_name: riva-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riva_bistro}
      POSTGRES_USER: ${POSTGRES_USER:-riva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riva_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - riva_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-riva} -d ${POSTGRES_DB:-riva_bistro}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: riva-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-riva}:${POSTGRES_PASSWORD:-riva_dev_password}@postgres:5432/${POSTGRES_DB:-riva_bistro}
    # Local hot-reload; image default is gunicorn for production.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
      - riva_media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: riva-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - ./scripts:/scripts:ro
      - ./frontend/packages/api-client:/app/packages/api-client:ro
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  riva_postgres_data:
  riva_media_data:
