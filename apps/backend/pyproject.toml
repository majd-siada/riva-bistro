[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
# Seed data tables are naturally wide (menu rows).
"**/management/commands/seed_*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
